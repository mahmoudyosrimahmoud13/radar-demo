name: Build Android APK

# Builds the radar companion app (it lives in radar_app/, not the repo root):
#  - on every push/PR to main/master: a CI check, APK attached as a run artifact
#  - on pushing a version tag (v1.0.0 etc.), or running this by hand with
#    "Create a GitHub Release" checked: also publishes a GitHub Release
#    with the APK attached as a downloadable asset -- a real link you can
#    hand someone to install it, not something buried in a CI run.
# No Play Store account or signing key needed for a sideload build like
# this one (Android will ask the installer to confirm "install from
# unknown sources" the first time, same as any APK outside the Play Store).
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish a GitHub Release with this build"
        type: boolean
        default: false

permissions:
  contents: write # needed to publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar_app
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android Gradle build)
        # Java 21, not 17: the Android lint tool bundled with current
        # Flutter/AGP calls Java 21-only methods (e.g. List.removeLast())
        # and crashes with NoSuchMethodError on Java 17.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate the android/ project if it's not committed
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mahmoud.radar .
          fi

      - name: Enable core library desugaring (flutter_local_notifications requires it)
        # Idempotent, and handles both Gradle file formats since recent
        # `flutter create` templates default to Kotlin DSL (build.gradle.kts)
        # instead of the older Groovy build.gradle. Appending a second
        # "android {}"/"dependencies {}" block is valid in both formats --
        # Gradle merges repeated blocks rather than requiring one edit in
        # place, so this never has to parse/modify the generated file.
        run: |
          GRADLE_FILE=""
          if [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE=android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            GRADLE_FILE=android/app/build.gradle
          fi
          if [ -n "$GRADLE_FILE" ] && ! grep -q "coreLibraryDesugaring" "$GRADLE_FILE"; then
            if [[ "$GRADLE_FILE" == *.kts ]]; then
              SNIPPET_B64="CmFuZHJvaWQgewogICAgY29tcGlsZU9wdGlvbnMgewogICAgICAgIGlzQ29yZUxpYnJhcnlEZXN1Z2FyaW5nRW5hYmxlZCA9IHRydWUKICAgIH0KfQoKZGVwZW5kZW5jaWVzIHsKICAgIGNvcmVMaWJyYXJ5RGVzdWdhcmluZygiY29tLmFuZHJvaWQudG9vbHM6ZGVzdWdhcl9qZGtfbGliczoyLjEuNCIpCn0K"
            else
              SNIPPET_B64="CmFuZHJvaWQgewogICAgY29tcGlsZU9wdGlvbnMgewogICAgICAgIGNvcmVMaWJyYXJ5RGVzdWdhcmluZ0VuYWJsZWQgdHJ1ZQogICAgfQp9CgpkZXBlbmRlbmNpZXMgewogICAgY29yZUxpYnJhcnlEZXN1Z2FyaW5nICdjb20uYW5kcm9pZC50b29sczpkZXN1Z2FyX2pka19saWJzOjIuMS40Jwp9Cg=="
            fi
            echo "$SNIPPET_B64" | base64 -d >> "$GRADLE_FILE"
            echo "Patched $GRADLE_FILE for core library desugaring"
          fi
          [ -n "$GRADLE_FILE" ] && cat "$GRADLE_FILE"

      - name: Make sure the Bluetooth/notification permissions are in the manifest
        # Idempotent: only adds a line if it's not already there, so this is
        # harmless whether android/ was just generated above or committed
        # to the repo with the permissions already in place.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in \
            "android.permission.BLUETOOTH" \
            "android.permission.BLUETOOTH_ADMIN" \
            "android.permission.BLUETOOTH_CONNECT" \
            "android.permission.BLUETOOTH_SCAN" \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.INTERNET"; do
            if ! grep -q "\"$PERM\"" "$MANIFEST"; then
              sed -i "0,/<application/s//<uses-permission android:name=\"$PERM\" \/>\n    <application/" "$MANIFEST"
            fi
          done
          cat "$MANIFEST"
          # Fail right here with a clear error if the manifest isn't valid XML,
          # instead of 3 minutes later deep inside Gradle.
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1]); print('Manifest is valid XML')" "$MANIFEST"

      - name: Apply the EchoSweep name and app icon
        run: |
          for d in branding/mipmap-*; do
            mkdir -p "android/app/src/main/res/$(basename "$d")"
            cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"
          done
          sed -i 's/android:label="[^"]*"/android:label="EchoSweep"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_bluetooth_serial's build.gradle
        # This plugin hasn't been updated since ~2021 and its build.gradle
        # still calls jcenter() (shut down, and removed as a Gradle method
        # entirely in Gradle 8) and applies the Android Gradle plugin the
        # old per-module way, which modern Flutter's root settings.gradle
        # (which already declares the AGP/Kotlin plugin versions once,
        # centrally) conflicts with. We rewrite the plugin's own
        # build.gradle in the pub cache, right after it's fetched, to a
        # minimal modern version. Nothing about the plugin's actual Dart
        # or Kotlin code changes -- only this one build file. The
        # replacement content is base64-encoded on a single line here
        # (rather than a multi-line heredoc) so it can't break this YAML
        # file's indentation rules.
        run: |
          shopt -s nullglob
          PATCHED_GRADLE_B64=""
          for f in "$HOME/.pub-cache/hosted/pub.dev/flutter_bluetooth_serial-"*/android/build.gradle; do
            echo "$PATCHED_GRADLE_B64" | base64 -d > "$f"
            echo "Patched $f"
          done

      - name: Raise every plugin's compileSdk to at least 36
        # Newer AndroidX/Flutter support libraries (e.g.
        # flutter_plugin_android_lifecycle) refuse to be used by a plugin
        # that compiles against an older Android API. Some plugins
        # (file_picker, and our patched flutter_bluetooth_serial) hard-code
        # 33/34/35. compileSdk only controls which Android APIs are visible
        # at compile time -- it doesn't change minSdk (which phones can
        # install the app) or targetSdk (runtime behavior), so raising it
        # is safe. Plugins already on 36+, or using Flutter's own value,
        # are left untouched.
        run: |
          shopt -s nullglob
          for f in "$HOME/.pub-cache/hosted/pub.dev/"*/android/build.gradle "$HOME/.pub-cache/hosted/pub.dev/"*/android/build.gradle.kts; do
            if grep -qE 'compileSdk(Version)?[[:space:]]*[=(]?[[:space:]]*(2[0-9]|3[0-5])\b' "$f"; then
              sed -i -E 's/(compileSdk(Version)?[[:space:]]*[=(]?[[:space:]]*)(2[0-9]|3[0-5])\b/\136/' "$f"
              echo "Raised compileSdk to 36 in $f"
            fi
          done

      - name: Analyze (non-blocking -- catches obvious issues without failing the build over lints)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-app-release-apk
          path: radar_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Rename APK for the release asset (version tag or run number)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="run-${GITHUB_RUN_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "radar-app-${VERSION}.apk"
          echo "ASSET_PATH=radar_app/radar-app-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true

  # Linux desktop build, packaged as a .deb. Same app and UI, but it talks
  # to the Uno over its USB cable (/dev/ttyACM0) instead of Bluetooth.
  # Runs after the Android job (even if that one failed), so the two never
  # race to create the same GitHub Release.
  build-linux:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar_app
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install the Linux desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate the linux/ project if it's not committed
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d linux ]; then
            flutter create --platforms=linux --org com.mahmoud.radar .
          fi
          # window title shows EchoSweep instead of radar_app
          sed -i 's/"radar_app"/"EchoSweep"/g' linux/runner/my_application.cc || true
          grep -n "EchoSweep" linux/runner/my_application.cc || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build the Linux app
        run: flutter build linux --release

      - name: Package it as a .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then VERSION="0.0.${GITHUB_RUN_NUMBER}"; fi
          BUNDLE=$(ls -d build/linux/x64/release/bundle)
          BIN=$(grep -oP 'set\(BINARY_NAME "\K[^"]+' linux/CMakeLists.txt)
          PKG="echosweep_${VERSION}_amd64"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/echosweep" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/pixmaps"
          cp -r "$BUNDLE"/. "$PKG/opt/echosweep/"
          ln -s "/opt/echosweep/$BIN" "$PKG/usr/bin/echosweep"
          cp branding/logo.png "$PKG/usr/share/pixmaps/echosweep.png"
          printf '%s\n' \
            "[Desktop Entry]" \
            "Name=EchoSweep" \
            "Comment=Ultrasonic radar over USB" \
            "Exec=/opt/echosweep/$BIN" \
            "Icon=echosweep" \
            "Terminal=false" \
            "Type=Application" \
            "Categories=Utility;Development;" \
            > "$PKG/usr/share/applications/echosweep.desktop"
          printf '%s\n' \
            "Package: echosweep" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Depends: libgtk-3-0" \
            "Recommends: zenity" \
            "Maintainer: EchoSweep <noreply@example.com>" \
            "Description: EchoSweep ultrasonic radar (USB serial desktop build)" \
            " Same app as the Android version, connected to the Arduino Uno over USB." \
            > "$PKG/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG"
          ls -la "$PKG.deb"
          echo "DEB_PATH=radar_app/$PKG.deb" >> "$GITHUB_ENV"

      - name: Upload .deb as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: echosweep-linux-deb
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      - name: Attach the .deb to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: ${{ env.DEB_PATH }}
