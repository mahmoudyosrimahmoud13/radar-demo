name: radar_app
description: EchoSweep -- companion app for the Arduino Bluetooth/WiFi radar.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_serial: ^0.4.0   # classic Bluetooth SPP (Android only) -- talks to the HC-05
  flutter_local_notifications: ^17.2.2  # Android notifications for entry/exit events
  sqflite: ^2.3.3                    # local event log database for the analytics screen
  path: ^1.9.0
  fl_chart: ^0.69.0                  # charts for the analytics screen
  file_picker: ^8.1.2                # pick a .hex file for OTA flashing
  intl: ^0.19.0
  permission_handler: ^11.3.1        # runtime Bluetooth/location permissions on Android
  shared_preferences: ^2.3.2          # remembers that the assembly guide was already shown

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
